name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            cd /var/www/html/monitoring-domain

            git fetch origin master
            git reset --hard origin/master

            STORAGE_ROOT=/var/www/storage-monitoring-domain
            mkdir -p "$STORAGE_ROOT/uploads" 2>/dev/null || true

            # Sync tracked public/uploads to VPS persistent storage if writable
            if [ -d public/uploads ] && [ -d "$STORAGE_ROOT/uploads" ] && [ -w "$STORAGE_ROOT/uploads" ]; then
              cp -an public/uploads/. "$STORAGE_ROOT/uploads/" 2>/dev/null || true
            fi

            if [ -d public/storage ] && [ -d "$STORAGE_ROOT" ] && [ -w "$STORAGE_ROOT" ]; then
              cp -an public/storage/. "$STORAGE_ROOT/" 2>/dev/null || true
            fi

            # Ensure local public/uploads exists for Next.js static serving
            mkdir -p public/uploads

            npm ci

            npx prisma db push --accept-data-loss
            npx prisma generate

            # Clean stale .next build cache to prevent ENOENT manifest errors and stale chunks
            rm -rf .next

            npm run build

            # PM2 management
            PM2_BIN="pm2"
            if ! command -v pm2 > /dev/null 2>&1; then
              PM2_BIN="npx pm2"
            fi

            echo "Managing process with $PM2_BIN on port 3009..."
            PORT=3008 $PM2_BIN restart monitoring-domain --update-env || PORT=3009 $PM2_BIN start npm --name monitoring-domain -- start -- -p 3009 || true
            $PM2_BIN save || true

      - name: Calculate Duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          TOTAL=$((END_TIME - START_TIME))

          HOURS=$((TOTAL / 3600))
          MINUTES=$(((TOTAL % 3600) / 60))
          SECONDS=$((TOTAL % 60))

          if [ $HOURS -gt 0 ]; then
            DURATION="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ $MINUTES -gt 0 ]; then
            DURATION="${MINUTES}m ${SECONDS}s"
          else
            DURATION="${SECONDS}s"
          fi

          echo "DURATION=$DURATION" >> $GITHUB_ENV
          echo "FINISHED=$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')" >> $GITHUB_ENV

      - name: Telegram Success Notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Deploy Notification*

            ✅ *Deploy Successful*

            📦 *Repository:* `${{ github.repository }}`
            🌿 *Branch:* `${{ github.ref_name }}`
            👤 *Committer:* `${{ github.actor }}`

            📝 *Commit:*
            `${{ github.event.head_commit.message }}`

            🔗 *Commit:*
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            🖥 *Server:*
            `${{ secrets.VPS_HOST }}`

            🌐 *Application Port:* `3009`
            🌐 *Application Link:* `https://monitoring-domain.elevore.web.id`

            🕒 *Finished:* `${{ env.FINISHED }}`
            ⏱ *Duration:* `${{ env.DURATION }}`

            🚀 *Status:* ✅ SUCCESS

      - name: Telegram Failed Notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Deploy Notification*

            ❌ *Deploy Failed*

            📦 *Repository:* `${{ github.repository }}`
            🌿 *Branch:* `${{ github.ref_name }}`
            👤 *Committer:* `${{ github.actor }}`

            📝 *Commit:*
            `${{ github.event.head_commit.message }}`

            🔗 *Commit:*
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            🖥 *Server:*
            `${{ secrets.VPS_HOST }}`

            🌐 *Application Port:* `3009`
            🌐 *Application Link:* `https://monitoring-domain.elevore.web.id`

            🕒 *Finished:* `${{ env.FINISHED }}`
            ⏱ *Duration:* `${{ env.DURATION }}`

            🚨 *Status:* ❌ FAILED

            👉 *Check GitHub Actions:*
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
